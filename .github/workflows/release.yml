name: Release

# Ao criar uma tag v* (ex.: git tag v1.0.0 && git push --tags), compila o instalador no Windows
# e publica o OompaLoompas-Setup.exe na release. O site aponta sempre para releases/latest.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar (compilador C# do .NET Framework, que já vem no Windows)
        shell: pwsh
        run: ./src/build.ps1

      - name: Publicar na release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OompaLoompas-Setup.exe
